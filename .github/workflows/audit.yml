name: audit

# Nightly: every link in report mode, then a rebuild with every
# ownership proof re-fetched (PA_VERIFY_AT_BUILD) and a redeploy, so the
# verification status the site shows is at most a day old. Never
# blocks, never cancels a deploy in flight (same concurrency group as
# deploy).
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: links, report mode
        run: node src/scripts/check-links.ts --all | tee links.txt
      - name: file or update the dead-links issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q "LINK_DEAD" links.txt; then
            BODY="$(grep LINK_DEAD links.txt | head -100)"
            N=$(gh issue list --label dead-link --state open --json number --jq '.[0].number // empty')
            if [ -n "$N" ]; then gh issue edit "$N" --body "$BODY"; else gh issue create --title "Dead links (nightly audit)" --label dead-link --body "$BODY"; fi
          fi
      - name: rebuild with every ownership proof re-fetched, and redeploy
        run: npm run build
        env:
          PA_VERIFY_AT_BUILD: "1"
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
